<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"><title>Scholo screen selection</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;cursor:crosshair;font:14px 'Segoe UI',sans-serif;background:#111}#screen{position:fixed;width:100vw;height:100vh;object-fit:fill}#dim{position:fixed;inset:0;background:#0005}#frame{position:fixed;display:none;border:2px solid #99e3bd;background:#ffffff10;box-shadow:0 0 0 99999px #0005;pointer-events:none}.hint{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#183a2d;color:#fff;padding:13px 22px;border-radius:10px;pointer-events:none;box-shadow:0 4px 25px #0004}.hint span{color:#b1c9bc;margin-left:12px;font-size:12px}
</style><style>body{width:100vw;height:100vh}#screen,#dim{pointer-events:none;user-select:none}</style></head><body><img id="screen" draggable="false" alt="Frozen screen preview"><div id="dim"></div><div id="frame"></div><div class="hint">Point to an item or drag an area<span>Esc to cancel</span></div><script src="capture-overlay.js"></script></body></html>
